services:
  cads_bridge:
    build:
      args:
        TARGETARCH: arm64
    labels:
      com.microsoft.visual-studio.project-name: "CadsBridge"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=5550
      - AWS__ServiceURL=http://cads-localstack:4566
      - EnableAdminEndpoints=true
      - EnableDataSeedingImportEndpoints=true
      - EnableTestSupportEndpoints=true
      - Storage__Internal__BucketName=cads-internal-bucket
      - Storage__Internal__HealthcheckEnabled=true
      - Storage__External__BucketName=cads-external-bucket
      - Storage__External__HealthcheckEnabled=true
      - Storage__External__AccessKeySecretName=
      - Storage__External__SecretKeySecretName=
      - Storage__External__EnvironmentName=PreProd
      - ApiClients__CdsApi__BaseUrl=http://cads_cds:5555/
      - ApiClients__CdsApi__BasicApiKey=${ApiClients__CdsApi__BasicApiKey:-}
      - ApiClients__CdsApi__XApiKey=
      - ApiClients__CdsApi__HealthcheckEnabled=true
      - ApiClients__CdsApi__UseFakeClient=${ApiClients__CdsApi__UseFakeClient:-true}
      - ApiClients__CdsApi__Sts__Enabled=false
      - ApiClients__CdsApi__Sts__Audience=https://localhost:5556
      - ApiClients__CdsApi__Sts__Mock__Enabled=${ApiClients__CdsApi__Sts__Mock__Enabled:-false}
      - ApiClients__CdsApi__Sts__Mock__TokenEndpoint=http://cads-sts-mock/connect/token
      - ApiClients__CdsApi__Sts__Mock__ClientId=${ApiClients__CdsApi__Sts__Mock__ClientId:-local-sts-cads-bridge}
      - ApiClients__CdsApi__Sts__Mock__ClientSecret=local-mock-secret
      - ApiClients__CdsApi__Sts__Mock__Scope=sts.cads-data-service
      - Messaging__Queues__CadsBridgeFifo__QueueUrl=http://cads-localstack:4566/000000000000/cads-bridge-queue.fifo
      - Messaging__Queues__CadsBridgeFifo__DlqQueueUrl=http://cads-localstack:4566/000000000000/cads-bridge-queue-deadletter.fifo
      - Messaging__Queues__CadsBridgeFifo__HealthcheckEnabled=true
      - IMB_S3_ACCESS_KEY=test
      - IMB_S3_ACCESS_SECRET=test
      - DataLoad__Salt=${DataLoad__Salt:-test-salt}
      - AuthenticationConfiguration__ApiKey__Enabled=true
      - AuthenticationConfiguration__AwsSts__Enabled=false
      - AuthenticationConfiguration__AwsSts__Audience=https://cads-bridge.local
      - AuthenticationConfiguration__AwsSts__TrustedOrgId=o-local
      - AuthenticationConfiguration__AwsSts__Environment=local
      - AuthenticationConfiguration__AwsSts__RequireHttpsMetadata=false
      - AuthenticationConfiguration__AzureAD__Enabled=true
      - AuthenticationConfiguration__AzureAD__Authority=http://cads-oidc-mock
      - AuthenticationConfiguration__AzureAD__Audience=api://local-cads-cds
      - AuthenticationConfiguration__AzureAD__MetadataAddress=http://cads-oidc-mock/.well-known/openid-configuration
      - AuthenticationConfiguration__AzureAD__RequireHttpsMetadata=false
      - AuthenticationConfiguration__AzureAD__ValidateIssuer=false
      - Acl__Clients__TestClient__Secret=test-secret
      - Acl__Clients__TestClient__Scopes__0=access
      - Encryption__CurrentKeyId=${ENCRYPTION_CURRENTKEYID:-V1},
      - Encryption__Keys__${ENCRYPTION_CURRENTKEYID:-V1}=${ENCRYPTION_KEY:-dGVzdC1lbmNyeXB0aW9uLWtleQ==}
    ports:
      - "5550"
    env_file:
      - ./.env
    volumes:
      # Mac-specific paths for seeding data, user secrets and HTTPS certificates
      - ../cads-data-seed/sql:/app/sql:ro
      - ~/.microsoft/usersecrets:/home/app/.microsoft/usersecrets:ro
      - ~/.microsoft/usersecrets:/root/.microsoft/usersecrets:ro
      - ~/.aspnet/https:/home/app/.aspnet/https:ro
      - ~/.aspnet/https:/root/.aspnet/https:ro