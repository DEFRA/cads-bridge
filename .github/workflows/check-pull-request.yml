name: Check Pull Request

on:
  pull_request:
    branches:
      - main
      - release/*
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review

jobs:
  pr-validator:
    name: Run Pull Request Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "10.0.x"
      - name: Check out code
        uses: actions/checkout@v3
        with: 
          path: working-dir
      - name: Restore
        run: dotnet restore ./working-dir/CadsBridge.sln
      - name: Build
        run: dotnet build ./working-dir/CadsBridge.sln --configuration Release --no-restore -warnaserror
      - name: Verify format
        run: dotnet format ./working-dir/CadsBridge.sln --verify-no-changes --verbosity diagnostic
      - name: Test (unit and component)
        run: dotnet test ./working-dir/CadsBridge.sln --filter Dependence!=testcontainers --logger "GitHubActions;summary.includePassedTests=true;summary.includeSkippedTests=true" --collect:"XPlat Code Coverage" --results-directory ./coverage
      - name: Install ReportGenerator
        run: dotnet tool install --global dotnet-reportgenerator-globaltool
      - name: Generate Coverage Summary
        run: |
          reportgenerator \
            -reports:"./coverage/**/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"Cobertura;MarkdownSummary" \
            -assemblyfilters:"+CadsBridge.*;-CadsBridge.*Testing.Support"
      - name: Code coverage report
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95
        with:
          filename: coverage-report/Cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: true
          indicators: true
          output: both
          thresholds: '60 80'
      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405
        if: github.event_name == 'pull_request'
        with:
          recreate: true
          path: code-coverage-results.md

  integration-tests:
    name: Run Integration Tests
    runs-on: ubuntu-latest
    needs: pr-validator
    env:
      TESTCONTAINERS_RYUK_DISABLED: true
      TESTCONTAINERS_CHECKS_DISABLE: true
    steps:
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '10.0.x'
      - name: Check out code
        uses: actions/checkout@v3
        with:
          path: working-dir
      - name: Create certs folder
        run: mkdir -p ./working-dir/certs
      - name: Generate HTTPS dev cert
        run: dotnet dev-certs https -ep ./working-dir/certs/https-dev-cert.pfx -p testpassword
      - name: Build cads_cds image
        run: docker build -t cads_cds:latest -f ./working-dir/Dockerfile ./working-dir
      - name: Pull localstack and mongo images
        run: |
          docker pull localstack/localstack:3.0.2
          docker pull mongo:6.0.13
      - name: Run integration tests
        run: dotnet test ./working-dir/CadsBridge.sln --filter Dependence=testcontainers -p:BuildInParallel=false

  sonarcloud-scan:
    name: CDP SonarCloud Scan
    uses: ./.github/workflows/sonarcloud.yml
    needs: pr-validator
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
