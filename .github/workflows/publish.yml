name: Publish

on:
  push:
    branches:
      - main
      - feature/*

permissions:
  id-token: write
  contents: write
  pull-requests: write

env:
  AWS_REGION: eu-west-2
  AWS_ACCOUNT_ID: "094954420758"

jobs:
  build:
    if: github.run_number != 1
    name: CDP-build-workflow
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out cads data seed
        uses: actions/checkout@v4
        with:
          repository: DEFRA/cads-data-seed
          path: cads-data-seed
          ref: main
          token: ${{ secrets.CADS_DATA_SEED_PAT_TOKEN }}

      - name: Copy SQL files into build context
        run: |
          mkdir -p sql
          cp -r cads-data-seed/sql/* sql/
          rm -rf cads-data-seed

      - name: List SQL files in build context
        run: |
          echo "SQL files in build context:"
          ls -R sql

      - name: Build and Publish
        uses: DEFRA/cdp-build-action/build@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
  ## SonarCloud
  ## Uncomment to unable SonarCloud scan
  ## Requires project to be set up in SonarCloud
